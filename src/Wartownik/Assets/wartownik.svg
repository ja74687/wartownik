<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Squircle background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E8AE5"/>
      <stop offset="55%" stop-color="#0078D4"/>
      <stop offset="100%" stop-color="#0058A0"/>
    </linearGradient>
    <!-- Subtle inner light from top-left -->
    <radialGradient id="hilite" cx="25%" cy="20%" r="80%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <!-- Drop on the mark for slight depth -->
    <filter id="markShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="8"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.25"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Squircle clip — rounded rect with Win11-style rounding -->
    <clipPath id="squircle">
      <rect x="0" y="0" width="1024" height="1024" rx="225" ry="225"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <g clip-path="url(#squircle)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <!-- Top-left highlight -->
    <rect width="1024" height="1024" fill="url(#hilite)"/>
    <!-- Subtle diagonal sheen -->
    <path d="M0 700 L1024 100 L1024 0 L0 0 Z" fill="#FFFFFF" fill-opacity="0.04"/>
    <!-- Bottom-right deepening -->
    <circle cx="1024" cy="1024" r="600" fill="#000000" fill-opacity="0.08"/>
  </g>

  <!-- Inner stroke for depth -->
  <rect x="6" y="6" width="1012" height="1012" rx="220" ry="220" fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="2"/>

  <g filter="url(#markShadow)">
    <!-- Sentinel eye: outer ring + inner dot -->
    <!-- Centered horizontally, upper portion -->
    <circle cx="512" cy="380" r="148" fill="none" stroke="#FFFFFF" stroke-width="44"/>
    <circle cx="512" cy="380" r="56" fill="#FFFFFF"/>

    <!-- Three data rows below (rows being watched over) -->
    <!-- Width tapers slightly to give sense of focus -->
    <rect x="232" y="592" width="560" height="44" rx="22" fill="#FFFFFF"/>
    <rect x="272" y="676" width="480" height="44" rx="22" fill="#FFFFFF" fill-opacity="0.85"/>
    <rect x="312" y="760" width="400" height="44" rx="22" fill="#FFFFFF" fill-opacity="0.65"/>
  </g>
</svg>
